<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Games TBD preview</title>
  <desc id="desc">A preview card for two private game prototypes: Silk Road and Animal Cafe.</desc>
  <defs>
