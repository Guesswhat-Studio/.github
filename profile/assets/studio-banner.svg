<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Guesswhat Studio banner</title>
  <desc id="desc">A colorful banner with a dice, sparks, cards, and playful system diagrams for Guesswhat Studio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171321"/>
      <stop offset="0.42" stop-color="#28304f"/>
      <stop offset="1" stop-color="#164a4f"/>
    </linearGradient>
    <linearGradient id="dice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="1" stop-color="#ffb86b"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be7ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9fb2"/>
      <stop offset="1" stop-color="#ffcf6b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="32" fill="url(#grid)"/>

  <g opacity="0.8">
    <circle cx="1058" cy="88" r="4" fill="#fff4c2"/>
    <circle cx="1130" cy="210" r="5" fill="#9be7ff"/>
    <circle cx="928" cy="330" r="4" fill="#ff9fb2"/>
    <circle cx="238" cy="76" r="5" fill="#ffcf6b"/>
    <circle cx="146" cy="306" r="3" fill="#9be7ff"/>
    <path d="M1096 118 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10z" fill="#ffcf6b" opacity="0.9"/>
    <path d="M188 118 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7z" fill="#9be7ff" opacity="0.9"/>
    <path d="M818 70 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#ff9fb2" opacity="0.9"/>
  </g>

  <g transform="translate(92 88)" filter="url(#softShadow)">
    <rect x="0" y="0" width="190" height="190" rx="34" fill="url(#dice)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="54" cy="54" r="14" fill="#171321"/>
    <circle cx="136" cy="54" r="14" fill="#171321"/>
    <circle cx="95" cy="95" r="14" fill="#171321"/>
    <circle cx="54" cy="136" r="14" fill="#171321"/>
    <circle cx="136" cy="136" r="14" fill="#171321"/>
    <path d="M154 26 c26 20 36 52 28 88" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(332 76)">
    <text x="0" y="72" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Guesswhat Studio</text>
    <text x="2" y="123" fill="#ffcf6b" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">全靠猜</text>
    <text x="2" y="174" fill="#f6f8fa" fill-opacity="0.92" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="650">Roll strange ideas into playable systems.</text>
    <text x="2" y="216" fill="#dbe7ff" fill-opacity="0.9" font-family="Segoe UI, Arial, sans-serif" font-size="23">Indie games · playful tools · good weird sparks</text>
    <text x="2" y="254" fill="#dbe7ff" fill-opacity="0.75" font-family="Segoe UI, Arial, sans-serif" font-size="20">独立游戏 · 好玩的工具 · 发光的奇怪想法</text>
  </g>

  <g transform="translate(850 116)" filter="url(#softShadow)">
    <rect x="0" y="34" width="142" height="186" rx="24" fill="url(#cardA)" transform="rotate(-9 71 127)" opacity="0.95"/>
    <rect x="126" y="0" width="142" height="186" rx="24" fill="url(#cardB)" transform="rotate(10 197 93)" opacity="0.95"/>
    <rect x="70" y="74" width="162" height="190" rx="26" fill="#fffaf0" opacity="0.98"/>
    <path d="M112 142 h78 M112 178 h48 M112 214 h92" stroke="#171321" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    <circle cx="190" cy="108" r="15" fill="#ff6f91"/>
    <circle cx="220" cy="108" r="15" fill="#40c9a2"/>
    <path d="M-10 248 C54 212 80 292 150 248 S256 222 318 260" fill="none" stroke="#ffcf6b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g opacity="0.35" stroke="#ffffff" stroke-width="3" fill="none">
    <path d="M62 358 C210 330 268 384 404 342 S624 318 744 368"/>
    <path d="M952 48 C1014 74 1068 36 1134 58 S1228 102 1260 74"/>
  </g>
</svg>
