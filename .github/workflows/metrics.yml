name: Metrics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Organization metrics require a PAT secret named METRICS_TOKEN with read:org.
      # Add repo scope only if private repositories should appear in generated metrics.
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Guesswhat-Studio
          filename: profile/metrics.overview.svg
          committer_message: "chore: update ${filename} [skip ci]"
          config_timezone: Europe/London
          config_display: columns
          base: header, activity, repositories, metadata
          repositories: 100
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_filter: push, issue, pr, release, ref/create

      - name: Featured projects
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Guesswhat-Studio
          filename: profile/metrics.projects.svg
          committer_message: "chore: update ${filename} [skip ci]"
          config_timezone: Europe/London
          config_display: columns
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: Linnet, Calabash, Opsis
          plugin_repositories_order: featured
